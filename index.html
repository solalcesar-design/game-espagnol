 const nf=rf(P.z),cy=Math.cos(nf.yaw),sy=Math.sin(nf.yaw),cxp=nf.x-cy*P.lat,czp=P.z+sy*P.lat,cyp=nf.y+(off>0?Math.sin(P.z*3.5)*.035*Math.min(1,off):0);
 const cyaw=nf.yaw-P.hdg-P.slip*P.steer*.15;car.position.set(cxp,cyp,czp);car.rotation.set(-nf.pitch,cyaw,0,'YXZ');
 cb.rotation.z+=(-(yr*P.v)*.0035-cb.rotation.z)*Math.min(1,dt*8);cb.rotation.x+=(-P.ax*.004-cb.rotation.x)*Math.min(1,dt*8);
 P.spin+=P.v*dt/.36;wheels.forEach(w=>{w.rotation.x=P.spin;if(w.userData.front)w.rotation.y=-P.steer*.3});
 tailM.color.setHex(P.brk>.15?0xff1e42:0x7f1d1d);
 TR.forEach((t,i)=>{if(i>=D().traf){t.g.visible=false;return}t.g.visible=true;t.z+=t.v*dt;if(t.z<P.z-90||t.z>P.z+700)resetTraffic(t,false);
  const tf=rf(t.z),l=t.lane*2.7;t.g.position.set(tf.x-Math.cos(tf.yaw)*l,tf.y,t.z+Math.sin(tf.yaw)*l);t.g.rotation.set(-tf.pitch*(t.lane>0?1:-1),tf.yaw+(t.lane<0?Math.PI:0),0,'YXZ');
  if(P.cd<=0&&Math.abs(t.z-P.z)<(t.d.l+3.7)/2&&Math.abs(l-P.lat)<(t.d.w+S.c.w)/2+.1){P.v*=D().pen;P.cd=1.2;P.clean=Math.max(0,P.clean-.3);G.money=Math.max(0,G.money-D().loss);P.shake=1;P.lat+=l>P.lat?-.8:.8;thud();toast('Collision !',D().loss?'Trajectoire pénalisée · -'+D().loss+' € de réparations':'Trajectoire pénalisée','amber');resetTraffic(t,false)}});
 const gz=P.sec+SECT,gf=rf(gz);gate.position.set(gf.x,gf.y,gz);gate.rotation.y=gf.yaw;
 const bz=Math.ceil((P.z+30)/1200)*1200,bf=rf(bz);bridge.position.set(bf.x,bf.y,bz);bridge.rotation.y=bf.yaw;
 const by=nf.yaw-P.hdg*.5,fx=Math.sin(by),fz=Math.cos(by),vr=P.v/S.max,sh=(P.shake*.4+(off>0?.05:0)+vr*vr*.02);
 if(!P.hood){car.visible=true;const d=6.6+vr*1.1;v3.set(cxp-fx*d,cyp+2.7-slope*1.2,czp-fz*d);cam.position.lerp(v3,Math.min(1,dt*10));lk.set(cxp+fx*14,cyp+1.1+slope*6,czp+fz*14)}
 else{car.visible=false;cam.position.set(cxp+fx*.4,cyp+1.25,czp+fz*.4);lk.set(cxp+fx*22,cyp+1.15+slope*12,czp+fz*22)}
 cam.position.x+=(Math.random()-.5)*sh;cam.position.y+=(Math.random()-.5)*sh;cam.lookAt(lk);
 const fov=58+vr*16;if(Math.abs(cam.fov-fov)>.1){cam.fov+=(fov-cam.fov)*.1;cam.updateProjectionMatrix()}
 atmos(dt);if(Math.floor(P.z/SEG)-4!==lastSeg)build(P.z);
 if(P.rain>.03){rainM.visible=true;rainM.material.opacity=P.rain*.55;const cf=Math.sin(by),cg=Math.cos(by);
  for(let i=0;i<RN;i++){const o=rO[i];o[1]-=dt*26;if(o[1]<0)o[1]+=20;const x=cam.position.x-cg*o[0]+cf*o[2],z=cam.position.z+cf*o[0]+cg*o[2],y=cam.position.y-6+o[1];rPos.set([x,y,z,x,y+.9,z],i*6)}rgl.attributes.position.needsUpdate=true}else rainM.visible=false;
 if(G.set.snd)sfx(S,off);
 if(++fr%3===0){T('spd',Math.round(P.v*3.6));T('gear',P.v*3.6>1?String(P.g+1):'N');$('rpm').style.width=Math.round(P.rpm*100)+'%';const sp2=Math.round(slope*100);T('slope',(sp2>0?'+':'')+sp2+'%');
  T('sec','Secteur '+G.sector+' · '+D().n);$('bar').style.width=clamp((P.z-P.sec)/SECT*100,0,100).toFixed(1)+'%';T('dist',(G.dist/1000).toFixed(2)+' km');T('money',fm(G.money));T('cl','Trajectoire '+Math.round(P.clean*100)+'%');
  if(fr%60===0&&P.v>1)save()}}
/* Menu / garage */
const upCost=(b,l)=>Math.round(b*Math.pow(1.55,l-1));
function renderMenu(){const S=stats(),o=S.o,s=G.set,pl=(a,k,t,on)=>`<button data-a="${a}" data-k="${k}" class="pl${on?' on':''}">${t}</button>`;
 $('mbox').innerHTML=`<div class="mh"><div><h2>Menu</h2><small>Jeu en pause</small></div><div class="g p"><small>Solde</small><b class="gr">${fm(G.money)}</b></div><button class="b pri" data-a="close">Reprendre la route</button></div>
<h3>Réglages</h3><div class="rw"><span>Commandes</span>${pl('ctl','btn','Boutons',s.ctl==='btn')}${pl('ctl','tilt','Inclinaison',s.ctl==='tilt')}${s.ctl==='tilt'?pl('cal','','Recalibrer',0)+pl('inv','',s.inv?'Sens inversé':'Sens normal',s.inv):''}</div>
<div class="rw"><span>Son</span>${pl('snd','1','Activé',s.snd)}${pl('snd','0','Coupé',!s.snd)}</div>
<div class="rw"><span>Difficulté</span>${DF.map((d,i)=>pl('diff',i,d.n,(s.diff??1)===i)).join('')}</div>
<div class="rw"><span>Qualité</span>${[['-1','Auto'],['0','Éco'],['1','Équilibré'],['2','Élevé']].map(([k,t])=>pl('q',k,t,s.q==+k)).join('')}<small>Relance le jeu · actuel : ${['Éco','Équilibré','Élevé'][TIER]}${SH?' + ombres':''}</small></div>
<h3>Préparation : ${S.c.name}</h3><div class="rw"><span>Peinture</span>${COLORS.map(c=>`<button data-a="col" data-k="${c}" class="sw${o.color===c?' on':''}" style="background:${c}"></button>`).join('')}</div>
<div class="grid">${UPS.map(([k,n,b])=>{const l=o.up[k],mx=l>=5,c=upCost(b,l);return`<div class="card"><b>${n}</b><small>Niveau ${l}/5</small><button data-a="up" data-k="${k}" ${mx||G.money<c?'disabled':''} class="b pri">${mx?'Maximum':'Améliorer ('+fm(c)+')'}</button></div>`}).join('')}</div>
<h3>Concession</h3><div class="grid">${CARS.map(c=>{const co=G.cars[c.id],sel=G.car===c.id;return`<div class="card${sel?' sel':''}"><b>${c.name}</b><small>${c.desc} ${c.spd} km/h · Tenue ${Math.round(c.grip*100)}%</small><button data-a="car" data-k="${c.id}" ${sel||(!co.own&&G.money<c.price)?'disabled':''} class="b ${co.own?'grn':'amb'}">${sel?'Véhicule actuel':co.own?'Conduire':'Acheter ('+fm(c.price)+')'}</button></div>`}).join('')}</div>
<div class="ft" style="justify-content:space-between;align-items:center"><a href="mentions-legales.html" target="_blank" rel="noopener" style="color:#7dd3fc;font-size:13px">Mentions légales</a><span><button class="b" data-a="demo">Mode démo (+5 000 €)</button> <button class="b" data-a="reset">Réinitialiser</button></span></div>
<p style="font-size:11px;color:#64748b;margin:14px 0 0">Jeu de simulation à vocation de divertissement. Véhicules fictifs. Moteur 3D : three.js (licence MIT).</p>`}
function openMenu(){P.paused=true;inp.l=inp.r=inp.gas=inp.brk=0;document.querySelectorAll('.t').forEach(b=>b.classList.remove('on'));if(M)M.gain.value=0;renderMenu();$('menu').classList.add('on')}
function closeMenu(){$('menu').classList.remove('on');P.paused=false;last=performance.now()}
$('menuB').onclick=openMenu;
$('mbox').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,k=b.dataset.k,S=stats();
 if(a==='close')return closeMenu();
 if(a==='q'){G.set.q=+k;save();return location.reload()}
 if(a==='ctl'){G.set.ctl=k;if(k==='tilt')startTilt();else tiltOK=false;applyCtl()}
 else if(a==='cal')neutral=null;else if(a==='inv')G.set.inv=!G.set.inv;
 else if(a==='diff'){G.set.diff=+k;TR.forEach(t=>resetTraffic(t,true))}
 else if(a==='snd'){G.set.snd=k==='1';initAudio()}
 else if(a==='col'){S.o.color=k;buildCar()}
 else if(a==='up'){const u=UPS.find(x=>x[0]===k),c=upCost(u[2],S.o.up[k]);if(S.o.up[k]<5&&G.money>=c){G.money-=c;S.o.up[k]++}}
 else if(a==='car'){const c=CARS.find(x=>x.id===k),co=G.cars[k];if(!co.own&&G.money>=c.price){G.money-=c.price;co.own=true}if(co.own){G.car=k;buildCar()}}
 else if(a==='demo')G.money+=5000;
 else if(a==='reset'){const q=G.set.q,df=G.set.diff;G=defSave();G.set.q=q;G.set.diff=df;Object.assign(P,{z:0,lat:2.7,hdg:0,v:0,sec:0,clean:1,g:0});TR.forEach(t=>resetTraffic(t,true));buildCar();applyCtl()}
 save();renderMenu()});
/* Boucle : 60 FPS visés ; baisse la résolution, puis les ombres, si l’appareil peine */
let last=performance.now(),ema=16.7,acc=0,good=0,slow=0;
function resize(){R.setPixelRatio(PR);R.setSize(innerWidth,innerHeight,false)}
function loop(now){requestAnimationFrame(loop);const raw=now-last;last=now;if(P.paused||document.hidden)return;
 step(Math.min(.05,raw/1000));R.render(scene,cam);
 if(raw<100){ema+=(raw-ema)*.05;acc+=raw}
 if(acc>1500){acc=0;
  if(ema>19&&PR>.8){PR=Math.max(.8,PR-.15);resize();good=0;slow=0}
  else if(ema>20&&SH&&++slow>2){SH=false;R.shadowMap.enabled=false;sun.castShadow=false;blobM.opacity=.6;scene.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>m.needsUpdate=true)})}
  else if(ema<15&&PR<maxPR){slow=0;if(++good>2){good=0;PR=Math.min(maxPR,PR+.15);resize()}}else good=0}}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();resize()});
document.addEventListener('visibilitychange',()=>{last=performance.now()});
applyCtl();requestAnimationFrame(loop);
</script></body></html>
